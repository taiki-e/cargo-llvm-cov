# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
unused-ignored-advisory = "deny"
yanked = "deny"
unmaintained = "none"
unsound = "all"
git-fetch-with-cli = true
ignore = [
    "RUSTSEC-2026-0194", # quick-xml (via lcov2cobertura). Not affected since lcov2cobertura emits xml, but doesn't parse.
    "RUSTSEC-2026-0195", # quick-xml (via lcov2cobertura). Not affected since lcov2cobertura doesn't use affected APIs.
]

# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
build.executables = "deny"
build.interpreted = "deny"
build.include-dependencies = true
build.include-workspace = false # covered by tools/tidy.sh
build.include-archives = true
build.allow-build-scripts = [
    { name = "anyhow" },
    { name = "camino" },
    { name = "fs-err" },
    { name = "libc" },
    { name = "proc-macro2" }, # via serde_derive
    { name = "quote" }, # via serde_derive
    { name = "rustix" }, # via tar
    { name = "serde_core" },
    { name = "serde_json" },
    { name = "serde" }, # https://github.com/serde-rs/serde/issues/2972
    { name = "zmij" }, # via serde_json
]
build.bypass = [
]

# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
unused-allowed-license = "deny"
unused-license-exception = "deny"
private.ignore = true
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0", # unicode-ident
]

# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unused-allowed-source = "deny"
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
]
